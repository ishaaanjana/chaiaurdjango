{% extends "layout.html" %}

{% block title %}
 chai Page
{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-center my-6">All chai for you</h1>

<div class="grid grid-cols-3 gap-4 m-4">
{% for chai in chais %}

<div class="bg-blue-500 p-5 rounded">
    <img class="rounded shadow lg" src="{{chai.image.url}}" alt="">
    <h3 class="text-2xl font-bold">{{chai.name}}</h3>
    
    <!-- Price -->
    <p class="text-white font-semibold my-2">Price: ₹{{chai.price}}</p>

    <a href="{% url 'chai_detail' chai.id %}">
        <button 
        type="button"
        style="background-color: #4ade80;"
        class="inline-flex items-center w-full justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-400">
         {{chai.type}} - {{chai.id}}
        </button>
    </a>
</div>

{% endfor %}
</div>

{% endblock %}
